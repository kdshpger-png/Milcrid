<!--
  Milcrid-App: Bildbetrachter (Klaus-Wunsch 2026-09-24: "ein Milcrid
  Bildbetrachter, wo man Bilder oeffnen, speichern kann").
  Nachgeladen von milcrid_portal.html (milcridAppLaden), "bb"-Vorsilbe.
  Bilder werden direkt ueber file:// angezeigt; Drehen + Speichern ueber
  window.milcrid.bildSpeichern / bildSpeichernUnter (main.js).
-->
<style>
  .bb [hidden]{display:none !important}
  .bb{display:flex; flex-direction:column; gap:10px; width:100%; height:100%; padding:12px 14px;
      box-sizing:border-box; font-family:var(--sans); color:var(--text)}
  .bb-leiste{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .bb-knopf{
    padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
    border:1.5px solid var(--surface-line); background:rgba(255,255,255,.05);
    color:var(--text); font-family:var(--sans); font-size:13px; min-width:34px;
  }
  .bb-knopf:hover:not(:disabled){border-color:var(--gold-line)}
  .bb-knopf:disabled{opacity:.35; cursor:default}
  .bb-knopf.haupt{border-color:var(--gold-line); color:var(--btn-text); font-weight:700;
    background:radial-gradient(circle at 50% 22%, var(--btn-light) 0%, var(--btn) 45%, var(--btn-dark) 100%)}
  .bb-trenner{width:1px; height:22px; background:var(--surface-line); margin:0 4px}
  .bb-zoom{min-width:52px; text-align:center; font-size:12.5px; color:var(--muted)}
  .bb-flaeche{
    flex:1 1 auto; min-height:0; position:relative; overflow:hidden; border-radius:10px;
    border:1px solid var(--surface-line); cursor:grab;
    /* Schachbrett: durchsichtige Stellen (PNG) sichtbar machen */
    background:
      repeating-conic-gradient(rgba(255,255,255,.035) 0% 25%, transparent 0% 50%) 50% / 24px 24px,
      rgba(0,0,0,.25);
  }
  .bb-flaeche.zieht{cursor:grabbing}
  .bb-bild{position:absolute; left:0; top:0; transform-origin:0 0; max-width:none; user-select:none;
    -webkit-user-drag:none; image-rendering:auto}
  .bb-bild.pixel{image-rendering:pixelated}
  .bb-leer{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:var(--muted); font-size:14px; text-align:center; padding:20px}
  .bb-leer-icon{font-size:48px; opacity:.7}
  .bb-status{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--muted); min-height:1.3em}
  .bb-status-name{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bb-status .fehler{color:#ff9d8a}
  .bb-status .erfolg{color:#8fe3a1}
</style>

<div class="bb" tabindex="0">
  <div class="bb-leiste">
    <button class="bb-knopf" id="bbOeffnen" type="button" title="Bild öffnen (Strg+O)">Öffnen</button>
    <span class="bb-trenner"></span>
    <button class="bb-knopf" id="bbZurueck" type="button" title="Vorheriges Bild im Ordner (←)">◀</button>
    <button class="bb-knopf" id="bbVor" type="button" title="Nächstes Bild im Ordner (→)">▶</button>
    <span class="bb-trenner"></span>
    <button class="bb-knopf" id="bbKleiner" type="button" title="Verkleinern (−)">−</button>
    <span class="bb-zoom" id="bbZoom">–</span>
    <button class="bb-knopf" id="bbGroesser" type="button" title="Vergrößern (+)">+</button>
    <button class="bb-knopf" id="bbEinpassen" type="button" title="Ganz ins Fenster (0)">Einpassen</button>
    <button class="bb-knopf" id="bbOriginal" type="button" title="Originalgröße (1)">100 %</button>
    <span class="bb-trenner"></span>
    <button class="bb-knopf" id="bbLinks" type="button" title="Nach links drehen (Umschalt+R)">⟲</button>
    <button class="bb-knopf" id="bbRechts" type="button" title="Nach rechts drehen (R)">⟳</button>
    <span class="bb-trenner"></span>
    <button class="bb-knopf haupt" id="bbSpeichern" type="button" title="Gedrehtes Bild speichern (Strg+S)">Speichern</button>
    <button class="bb-knopf" id="bbSpeichernUnter" type="button" title="Als neue Datei speichern (Strg+Umschalt+S)">Speichern unter</button>
  </div>
  <div class="bb-flaeche" id="bbFlaeche">
    <img class="bb-bild" id="bbBild" alt="" hidden>
    <div class="bb-leer" id="bbLeer">
      <div class="bb-leer-icon">🖼️</div>
      <div>Noch kein Bild offen.<br>„Öffnen“ – oder im Datei Manager doppelt auf ein Bild klicken.</div>
    </div>
  </div>
  <div class="bb-status">
    <span class="bb-status-name" id="bbName"></span>
    <span id="bbMeldung"></span>
    <span id="bbInfo"></span>
  </div>
</div>
