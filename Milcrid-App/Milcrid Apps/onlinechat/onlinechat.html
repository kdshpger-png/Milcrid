<!--
  Milcrid-App: Online KI (Klaus, 15.09.2026)
  Chat mit einer Online-KI ueber den eigenen API-Schluessel. Oben Anbieter und
  der Schalter "Verbindung" (beim Start immer aus), in der Mitte der Chat,
  unten die Eingabe wie in der Portal-Leiste. Schluessel werden im Bereich
  API KI eingetragen, nie hier. Nachgeladen von milcrid_portal.html,
  "ok"-Vorsilbe, Daten nur ueber window.milcridOnlineKi.
-->
<style>
  .ok [hidden]{display:none !important}
  .ok-huelle{width:100%; height:100%; container-type:size}
  .ok{display:flex; flex-direction:column; gap:10px; width:100%; height:100%; padding:12px 14px;
      box-sizing:border-box; font-family:var(--sans); color:var(--text)}

  .ok-kopf{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .ok-auswahl{background:rgba(255,255,255,.04); border:1px solid var(--surface-line); border-radius:9px;
    padding:6px 10px; color:var(--text); font-family:var(--sans); font-size:13px; outline:none; max-width:220px}
  .ok-auswahl option{background:#0b1a3a}
  .ok-modell{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px}
  .ok-rechts{margin-left:auto; display:flex; align-items:center; gap:10px}
  .ok-schalter-text{font-size:13px; font-weight:600}
  .ok-schalter{position:relative; flex:0 0 auto; width:44px; height:24px; border-radius:999px; cursor:pointer;
    background:var(--faint); border:1px solid var(--surface-line); transition:background .2s; padding:0}
  .ok-schalter::after{content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.4); transition:transform .2s}
  .ok-schalter.an{background:#2e9e5b; border-color:#2e9e5b}
  .ok-schalter.an::after{transform:translateX(20px)}
  .ok-schalter:disabled{opacity:.45; cursor:not-allowed}

  /* Die eine Zeile, an der man sofort sieht, ob etwas nach draussen geht */
  .ok-lage{font-size:12.5px; padding:6px 12px; border-radius:10px; border:1px solid var(--surface-line);
    background:rgba(255,255,255,.03); color:var(--muted)}
  .ok-lage.offen{color:#8fe3a1; border-color:rgba(143,227,161,.4); background:rgba(143,227,161,.08)}

  .ok-verlauf{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px;
    padding:4px 4px 4px 0}
  .ok-leer{margin:auto; text-align:center; color:var(--muted); font-size:13px; max-width:420px; line-height:1.6}
  .ok-leer b{color:var(--text)}
  .ok-blase{max-width:86%; border-radius:14px; padding:10px 14px; font-size:13.5px; line-height:1.55;
    word-break:break-word; user-select:text}
  .ok-blase.nutzer{align-self:flex-end; background:var(--accent-dim); border:1px solid var(--surface-line)}
  .ok-blase.ki{align-self:flex-start; background:var(--surface); border:1px solid var(--surface-line)}
  .ok-blase-kopf{font-size:11px; color:var(--muted); margin-bottom:4px; user-select:none}
  .ok-absatz{white-space:pre-wrap}
  .ok-dateien{font-size:12px; color:var(--gold); margin-bottom:4px}
  .ok-code{position:relative; margin:8px 0; background:#050d1f; border:1px solid var(--surface-line); border-radius:10px}
  .ok-code-kopf{display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted);
    padding:4px 10px; border-bottom:1px solid var(--surface-line); user-select:none}
  .ok-code pre{margin:0; padding:10px 12px; overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.5;
    white-space:pre; color:#e6edf7}
  .ok-blase-fuss{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; user-select:none}
  .ok-warten{align-self:flex-start; color:var(--muted); font-size:13px; padding:6px 4px}
  .ok-warten::after{content:' …'; animation:okPunkte 1.2s steps(3) infinite}
  @keyframes okPunkte{0%{content:' .'}33%{content:' ..'}66%{content:' …'}}

  .ok-knopf{padding:5px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
    border:1.5px solid var(--surface-line); background:rgba(255,255,255,.05); color:var(--text);
    font-family:var(--sans); font-size:12px}
  .ok-knopf:hover{border-color:var(--gold-line)}
  .ok-knopf:disabled{opacity:.45; cursor:not-allowed}
  .ok-knopf.haupt{border-color:var(--gold-line); color:var(--btn-text); font-weight:700; font-size:13px; padding:8px 18px;
    background:radial-gradient(circle at 50% 22%, var(--btn-light) 0%, var(--btn) 45%, var(--btn-dark) 100%)}
  .ok-knopf.klein{padding:2px 9px; font-size:11px}

  .ok-anhaenge{display:flex; gap:6px; flex-wrap:wrap}
  .ok-anhang{display:flex; align-items:center; gap:6px; font-size:12px; padding:3px 6px 3px 10px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid var(--surface-line)}
  .ok-anhang button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:0 4px}
  .ok-anhang button:hover{color:#ff9d8a}
  .ok-eingabe{display:flex; gap:8px; align-items:flex-end}
  .ok-text{flex:1 1 auto; min-height:44px; max-height:160px; resize:none; box-sizing:border-box;
    background:rgba(255,255,255,.04); border:1px solid var(--surface-line); border-radius:12px; padding:10px 12px;
    color:var(--text); font-family:var(--sans); font-size:13.5px; line-height:1.45; outline:none}
  .ok-text:focus{border-color:var(--accent)}
  .ok-text:disabled{opacity:.5}
  .ok-fuss{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .ok-status{margin-left:auto; font-size:12.5px; text-align:right; min-height:1.2em}
  .ok-status.fehler{color:#ff9d8a}
  .ok-status.erfolg{color:#8fe3a1}
  @container (max-width: 520px){
    .ok-rechts{margin-left:0}
    .ok-blase{max-width:100%}
    .ok-status{margin-left:0; text-align:left; flex-basis:100%}
  }
</style>

<div class="ok-huelle">
<div class="ok">
  <div class="ok-kopf">
    <select class="ok-auswahl" id="okAnbieter" title="Mit welcher KI"></select>
    <span class="ok-modell" id="okModell"></span>
    <div class="ok-rechts">
      <span class="ok-schalter-text">Verbindung</span>
      <button class="ok-schalter" id="okVerbindung" type="button" title="Verbindung an/aus"></button>
    </div>
  </div>
  <div class="ok-lage" id="okLage">Verbindung aus – es geht nichts nach draußen.</div>

  <div class="ok-verlauf" id="okVerlauf"></div>

  <div class="ok-anhaenge" id="okAnhaenge" hidden></div>
  <div class="ok-eingabe">
    <button class="ok-knopf" id="okDatei" type="button" title="Dokumente oder Bilder anhängen">📎 Datei</button>
    <textarea class="ok-text" id="okText" rows="1" placeholder="Nachricht an die Online-KI …" title="Enter = senden, Umschalt+Enter = neue Zeile"></textarea>
    <button class="ok-knopf haupt" id="okSenden" type="button">Senden</button>
  </div>
  <div class="ok-fuss">
    <button class="ok-knopf" id="okNeu" type="button">Neuer Chat</button>
    <button class="ok-knopf" id="okChatSpeichern" type="button">Chat speichern</button>
    <button class="ok-knopf" id="okOrdner" type="button">Ordner „Online KI Downloads“</button>
    <button class="ok-knopf" id="okApiKi" type="button">🔌 API KI</button>
    <div class="ok-status" id="okStatus"></div>
  </div>
</div>
</div>
